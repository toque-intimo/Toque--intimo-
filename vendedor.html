<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOQUE ÍNTIMO GS - Gestão de Vendedoras</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header { border-bottom: 2px solid #e9ecef; padding-bottom: 15px; margin-bottom: 25px; }
        .header h2 { color: #d63384; margin: 0 0 5px 0; }
        .card { background: #fff; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .card h3 { margin-top: 0; color: #495057; border-left: 4px solid #d63384; padding-left: 10px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; }
        .btn-whatsapp { background-color: #25d366; color: white; border: none; padding: 12px 20px; cursor: pointer; border-radius: 6px; font-size: 15px; font-weight: 600; width: 100%; }
        .btn-whatsapp:hover { background-color: #1ebe5d; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e9ecef; font-size: 14px; }
        th { background-color: #f1f3f5; color: #495057; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .pendente { background-color: #fff3bf; color: #f59f00; }
        .completo { background-color: #d3f9d8; color: #2b8a3e; }
        .btn-detalhes { background-color: #e7f5ff; color: #1971c2; border: 1px solid #a5d8ff; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Gestão de Revendedoras — TOQUE ÍNTIMO GS</h2>
        <p>Painel com sincronização em tempo real via Firebase</p>
    </div>

    <!-- Formulário -->
    <div class="card">
        <h3>Cadastrar Nova Revendedora</h3>
        <div class="form-grid">
            <div class="form-group">
                <label for="nomeVendedor">Nome da Vendedora:</label>
                <input type="text" id="nomeVendedor" placeholder="Ex: Maria Silva">
            </div>
            <div class="form-group">
                <label for="telVendedor">WhatsApp (com DDD):</label>
                <input type="text" id="telVendedor" placeholder="Ex: 11999999999">
            </div>
        </div>
        <button class="btn-whatsapp" onclick="cadastrarEEnviarWhatsApp()">
            📲 Salvar no Firebase e Enviar Convite via WhatsApp
        </button>
    </div>

    <!-- Lista em Tempo Real -->
    <div class="card">
        <h3>Revendedoras Cadastradas</h3>
        <table>
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>WhatsApp</th>
                    <th>Data</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaVendedores">
                <tr><td colspan="6" style="text-align:center;">Carregando dados...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- SDKs do Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
    // 1. Substitua com as chaves do seu Console do Firebase
    const firebaseConfig = {
  apiKey: "AIzaSyDpUFJnqqg4LX17Nk24zR9rg1C923VcLME",
  authDomain: "cadastro-vendedor.firebaseapp.com",
  projectId: "cadastro-vendedor",
  storageBucket: "cadastro-vendedor.firebasestorage.app",
  messagingSenderId: "640048043072",
  appId: "1:640048043072:web:b0c484a751ab420fed3ba5"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Escuta alterações em tempo real no banco
    db.collection("vendedores").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
        const tbody = document.getElementById('tabelaVendedores');
        tbody.innerHTML = '';

        if (snapshot.empty) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhuma revendedora salva ainda.</td></tr>';
            return;
        }

        snapshot.forEach((doc) => {
            const v = doc.data();
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${v.codigo}</strong></td>
                <td>${v.nome}</td>
                <td>${v.telefone}</td>
                <td>${v.data}</td>
                <td><span class="badge ${v.status === 'Completo' ? 'completo' : 'pendente'}">${v.status || 'Pendente'}</span></td>
                <td><button class="btn-detalhes" onclick="verDetalhes('${doc.id}')">Detalhes</button></td>
            `;
            tbody.appendChild(tr);
        });
    });

    async function cadastrarEEnviarWhatsApp() {
    const nome = document.getElementById('nomeVendedor').value.trim();
    const telefone = document.getElementById('telVendedor').value.trim();

    if (!nome || !telefone) {
        alert('Preencha o nome e o telefone!');
        return;
    }

    const codigoUnico = 'GS-' + Math.floor(1000 + Math.random() * 9000);
    const dataAtual = new Date().toLocaleDateString('pt-BR');

    try {
        // Salva na coleção "vendedores" do Firestore
        const docRef = await db.collection("vendedores").add({
            codigo: codigoUnico,
            nome: nome,
            telefone: telefone,
            data: dataAtual,
            status: 'Pendente',
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('nomeVendedor').value = '';
        document.getElementById('telVendedor').value = '';

        // 🟢 AQUI ESTÁ A ALTERAÇÃO DO LINK:
        const linkCadastro = `https://SEU-USUARIO.github.io/NOME-DO-REPOSITORIO/cadastro.html?id=${docRef.id}`;
        
        const mensagem = `Olá ${nome}! Você foi convidado(a) para ser revendedor(a) da TOQUE ÍNTIMO GS.\n\nClique no link para completar seu cadastro:\n${linkCadastro}`;
        
        const telefoneLimpo = telefone.replace(/\D/g, '');
        window.open(`https://wa.me/55${telefoneLimpo}?text=${encodeURIComponent(mensagem)}`, '_blank');

    } catch (error) {
        alert("Erro ao salvar no Firebase: " + error.message);
    }
}


    // 4. Exibe os detalhes
    async function verDetalhes(id) {
        const doc = await db.collection("vendedores").doc(id).get();
        if (doc.exists) {
            const v = doc.data();
            alert(`📋 DETALHES DA REVENDEDORA:\n\n` +
                  `Código: ${v.codigo}\n` +
                  `Nome: ${v.nome}\n` +
                  `WhatsApp: ${v.telefone}\n` +
                  `Data do Convite: ${v.data}\n` +
                  `Status: ${v.status || 'Pendente'}\n` +
                  `E-mail: ${v.email || 'Pendente'}\n` +
                  `Endereço: ${v.endereco || 'Pendente'}`);
        }
    }
</script>

</body>
</html>
