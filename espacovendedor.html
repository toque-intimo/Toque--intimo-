<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Vendedor - Lançar Pedido</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }

        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .item-row input {
            flex: 1;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add {
            background-color: #6c757d;
            color: white;
            margin-bottom: 15px;
        }

        .btn-add:hover {
            background-color: #5a6268;
        }

        .btn-submit {
            background-color: #28a745;
            color: white;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-submit:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .btn-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }

        .btn-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Espaço do Vendedor</h1>
    <form id="formPedido">
        <div class="form-group">
            <label for="cliente">Nome do Cliente:</label>
            <input type="text" id="cliente" placeholder="Digite o nome do cliente" required>
        </div>

        <div class="form-group">
            <label>Itens do Pedido:</label>
            <div id="listaItens">
                <div class="item-row">
                    <input type="text" placeholder="Nome do produto" class="item-nome" required>
                    <input type="number" placeholder="Qtd" class="item-qtd" min="1" value="1" style="max-width: 80px;" required>
                    <input type="number" placeholder="Preço R$" class="item-preco" step="0.01" min="0" style="max-width: 110px;" required>
                </div>
            </div>
            <button type="button" class="btn btn-add" id="btnAdicionarItem">+ Adicionar Outro Item</button>
        </div>

        <button type="submit" id="btnSalvar" class="btn btn-submit">Enviar Pedido para o Firebase</button>
    </form>

    <a href="index.html" class="btn-link">← Voltar para o Painel Principal (Index)</a>
</div>

<!-- SDKs do Firebase (Modular v10+) -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas configurações do Firebase
    const firebaseConfig = {
        apiKey: "SEU_API_KEY",
        authDomain: "SEU_PROJECT_ID.firebaseapp.com",
        projectId: "SEU_PROJECT_ID",
        storageBucket: "SEU_PROJECT_ID.appspot.com",
        messagingSenderId: "SEU_SENDER_ID",
        appId: "SEU_APP_ID"
    };

    // Inicializa o Firebase e o Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Adicionar novas linhas de itens
    document.getElementById('btnAdicionarItem').addEventListener('click', () => {
        const listaItens = document.getElementById('listaItens');
        const novaLinha = document.createElement('div');
        novaLinha.classList.add('item-row');
        novaLinha.innerHTML = `
            <input type="text" placeholder="Nome do produto" class="item-nome" required>
            <input type="number" placeholder="Qtd" class="item-qtd" min="1" value="1" style="max-width: 80px;" required>
            <input type="number" placeholder="Preço R$" class="item-preco" step="0.01" min="0" style="max-width: 110px;" required>
        `;
        listaItens.appendChild(novaLinha);
    });

    // Evento de submissão para salvar no Firebase
    document.getElementById('formPedido').addEventListener('submit', async (e) => {
        e.preventDefault();

        const btnSalvar = document.getElementById('btnSalvar');
        btnSalvar.disabled = true;
        btnSalvar.innerText = "Enviando...";

        const cliente = document.getElementById('cliente').value.trim();
        const nomes = document.querySelectorAll('.item-nome');
        const quantidades = document.querySelectorAll('.item-qtd');
        const precos = document.querySelectorAll('.item-preco');

        let itens = [];
        let totalPedido = 0;

        for (let i = 0; i < nomes.length; i++) {
            const nome = nomes[i].value.trim();
            const qtd = parseInt(quantidades[i].value, 10) || 1;
            const preco = parseFloat(precos[i].value) || 0;

            if (nome && preco >= 0) {
                itens.push({
                    nome: nome,
                    qtd: qtd,
                    preco: preco
                });
                totalPedido += qtd * preco;
            }
        }

        try {
            // Adiciona um documento na coleção 'pedidos'
            await addDoc(collection(db, "pedidos"), {
                cliente: cliente,
                itens: itens,
                total: totalPedido,
                status: "Pendente",
                criadoEm: serverTimestamp()
            });

            alert("Pedido salvo com sucesso no Firebase!");
            window.location.href = "index.html";
        } catch (error) {
            console.error("Erro ao salvar o pedido: ", error);
            alert("Ocorreu um erro ao salvar o pedido no banco de dados.");
            btnSalvar.disabled = false;
            btnSalvar.innerText = "Enviar Pedido para o Firebase";
        }
    });
</script>

</body>
</html>
