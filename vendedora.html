<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Portal da Vendedora - Toque Íntimo GS</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 <style> 
 :root {
   --primary: #70293b;
   --primary-dark: #501926;
   --primary-light: #fbeee8;
   --bg: #f8f9fa;
   --text-dark: #2d2d2d;
   --text-muted: #777777;
   --card-border: #e2e8f0;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
 body { background-color: var(--bg); color: var(--text-dark); padding-bottom: 40px; }
 .container { max-width: 500px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
 
 /* CABEÇALHO */
 .header { padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
 .brand-title { font-size: 26px; font-weight: 800; color: var(--primary-dark); line-height: 1.1; }
 .brand-subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
 .user-badge { display: flex; align-items: center; gap: 8px; }
 .user-name { background: var(--primary-light); color: var(--primary-dark); font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; }
 .btn-logout { color: #cc0000; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; background: transparent; }

 /* BANNER DE MÉTRICAS */
 .metrics-banner { background: var(--primary); padding: 15px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
 .metric-card { background: rgba(0,0,0,0.18); border-radius: 8px; padding: 12px 6px; text-align: center; color: white; }
 .metric-label { font-size: 11px; opacity: 0.9; margin-bottom: 6px; display: block; white-space: nowrap; }
 .metric-value { font-size: 16px; font-weight: 700; }
 .metric-value.green { color: #4cd964; }

 /* BOTÃO COMPARTILHAR */
 .share-area { padding: 12px 15px 5px 15px; }
 .btn-whatsapp { background-color: #25D366; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

 /* NAVEGAÇÃO / ABAS */
 .nav-tabs { display: flex; border-bottom: 2px solid #e0e0e0; background: white; margin-top: 10px; }
 .tab-btn { flex: 1; padding: 14px 0; border: none; background: none; font-size: 13px; font-weight: 700; color: #555; cursor: pointer; text-align: center; position: relative; }
 .tab-btn.active { color: var(--primary); }
 .tab-btn.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 3px; background: var(--primary); }
 .badge-cart { background: var(--primary-light); color: var(--primary-dark); font-size: 11px; padding: 2px 7px; border-radius: 10px; margin-left: 3px; font-weight: bold; }

 /* TELAS E SEÇÕES */
 .app-section { display: none; padding: 15px; }
 .app-section.active { display: block; }

 /* CATEGORIAS EM BOTAO PILL */
 .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 15px 0; scrollbar-width: none; }
 .categories-bar::-webkit-scrollbar { display: none; }
 .btn-cat { padding: 8px 18px; border-radius: 20px; border: 1px solid #ddd; background: #fff; color: #333; font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; }
 .btn-cat.active { background: var(--primary); color: white; border-color: var(--primary); }

 /* CARDS DE PRODUTO */
 .prod-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
 .prod-card { background: #fff; border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; }
 .btn-action { background: var(--primary); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 12px; margin-top: 8px; }
 
 /* FORMULÁRIO CADASTRO */
 .grid-form { display: flex; flex-direction: column; gap: 12px; }
 .form-group { display: flex; flex-direction: column; gap: 5px; }
 .form-group label { font-size: 12px; font-weight: 600; color: #555; }
 .form-group input { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; font-size: 14px; background: #fafafa; outline: none; width: 100%; }
 </style>
</head>
<body>

<div class="container">

 <!-- TELA DE CADASTRO -->
 <section id="tela-cadastro-vendedora" class="app-section active" style="padding-top: 30px;">
   <h2 style="color: var(--primary-dark); text-align: center; margin-bottom: 8px;">Toque Íntimo GS</h2>
   <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px;">Cadastre-se para acessar o Portal da Vendedora</p>
   
   <form id="formVendedora" class="grid-form">
     <div class="form-group"><label>Nome Completo</label><input type="text" id="ven-nome" required></div>
     <div class="form-group"><label>WhatsApp</label><input type="text" id="ven-tel" placeholder="11999999999" required></div>
     <div class="form-group"><label>E-mail</label><input type="email" id="ven-email" required></div>
     <div class="form-group"><label>Endereço</label><input type="text" id="ven-endereco" required></div>
     <div class="form-group"><label>Número</label><input type="text" id="ven-num" required></div>
     <div class="form-group"><label>Chave Pix</label><input type="text" id="ven-pix" placeholder="CPF, E-mail ou Telefone" required></div>
     <button type="submit" class="btn-action" style="padding: 14px; font-size: 14px; margin-top: 10px;">Finalizar Cadastro</button>
   </form>
 </section>

 <!-- ÁREA LOGADA DA VENDEDORA -->
 <div id="area-vendedora" style="display: none;">
   
   <!-- CABEÇALHO -->
   <header class="header">
     <div>
       <div class="brand-title">Toque Íntimo GS</div>
       <div class="brand-subtitle">Estilo, Conforto e Sofisticação</div>
     </div>
     <div class="user-badge">
       <span class="user-name" id="ven-nome-exibicao">Gisele</span>
       <button class="btn-logout" onclick="logoutVendedora()">Sair</button>
     </div>
   </header>

   <!-- MÉTRICAS DO MÊS -->
   <section class="metrics-banner">
     <div class="metric-card">
       <span class="metric-label">Vendas do Mês</span>
       <div class="metric-value" id="ven-val-vendas">R$ 0,00</div>
     </div>
     <div class="metric-card">
       <span class="metric-label">Itens Vendidos</span>
       <div class="metric-value" id="ven-qtd-vendas">0</div>
     </div>
     <div class="metric-card">
       <span class="metric-label">Comissão (15%)</span>
       <div class="metric-value green" id="ven-val-comissao">R$ 0,00</div>
     </div>
   </section>

   <!-- ÁREA DE COMPARTILHAMENTO DO CATÁLOGO -->
   <div class="share-area">
     <button class="btn-whatsapp" onclick="enviarCatalogoClienteWhatsapp()">
       <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> Enviar Catálogo para Cliente
     </button>
   </div>

   <!-- NAVEGAÇÃO PRINCIPAL (ABAS) -->
   <nav class="nav-tabs">
     <button class="tab-btn active" onclick="alternarAba('produtos', this)">Produtos</button>
     <button class="tab-btn" onclick="alternarAba('carrinho', this)">Carrinho <span class="badge-cart" id="qtd-carrinho-badge">0</span></button>
     <button class="tab-btn" onclick="alternarAba('vendas', this)">Minhas Vendas</button>
     <button class="tab-btn" onclick="alternarAba('financeiro', this)">Financeiro</button>
   </nav>

   <!-- SUB-TELA: PRODUTOS -->
   <section id="aba-produtos" class="app-section active">
     <div class="categories-bar" id="ven-categorias-bar">
       <button class="btn-cat active" onclick="filtrarCategoriaVen('todas', this)">Todas</button>
       <button class="btn-cat" onclick="filtrarCategoriaVen('Lingerie', this)">Lingerie</button>
       <button class="btn-cat" onclick="filtrarCategoriaVen('Sutiã', this)">Sutiã</button>
       <button class="btn-cat" onclick="filtrarCategoriaVen('Body', this)">Body</button>
       <button class="btn-cat" onclick="filtrarCategoriaVen('Calcinha', this)">Calcinha</button>
     </div>

     <div id="ven-grade-produtos" class="prod-grid"></div>
   </section>

   <!-- SUB-TELA: CARRINHO -->
   <section id="aba-carrinho" class="app-section">
     <div id="ven-itens-carrinho" style="margin-top: 10px;"></div>
     <button class="btn-action" style="background: #1e7e48; margin-top: 15px; padding: 14px;" onclick="enviarPedidoParaLojaPrincipal()">Enviar Pedido para Toque Íntimo GS</button>
   </section>

   <!-- SUB-TELA: MINHAS VENDAS -->
   <section id="aba-vendas" class="app-section">
     <div id="ven-historico-vendas" style="margin-top: 10px;"></div>
   </section>

   <!-- SUB-TELA: FINANCEIRO -->
   <section id="aba-financeiro" class="app-section">
     <div id="ven-dados-financeiros" style="margin-top: 10px;"></div>
   </section>

 </div>

</div>

<!-- MODAL GALERIA -->
<div id="ven-modal-foto" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 99999; justify-content: center; align-items: center; flex-direction: column; padding: 10px;">
  <span style="position: absolute; top: 15px; right: 20px; color: white; font-size: 32px; font-weight: bold; cursor: pointer; z-index: 100000;" onclick="fecharFotoExpandidaVen()">&times;</span>
  <div style="position: relative; max-width: 90%; max-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <button id="btn-foto-prev" onclick="mudarFotoModal(-1)" style="position: absolute; left: -15px; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 20px; padding: 12px 10px; border-radius: 50%; cursor: pointer; z-index: 100001;"><i class="fa-solid fa-chevron-left"></i></button>
    <img id="ven-img-expandida" src="" style="max-width: 100%; max-height: 75vh; border-radius: 12px; object-fit: contain;">
    <button id="btn-foto-next" onclick="mudarFotoModal(1)" style="position: absolute; right: -15px; background: rgba(255,255,255,0.2); color: white; border: none; font-size: 20px; padding: 12px 10px; border-radius: 50%; cursor: pointer; z-index: 100001;"><i class="fa-solid fa-chevron-right"></i></button>
  </div>
  <div id="ven-foto-contador" style="color: white; margin-top: 10px; font-size: 13px;"></div>
</div>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script>
 const firebaseConfig = {
   apiKey: "AIzaSyD6QAOn1t-W6E4465u3ACZ2bB25RIAkpbo",
   authDomain: "meucatalogoapp-c7e39.firebaseapp.com",
   projectId: "meucatalogoapp-c7e39",
   storageBucket: "meucatalogoapp-c7e39.appspot.com",
   messagingSenderId: "311764083576",
   appId: "1:311764083576:web:2630353079ec5294031e8d"
 };
 firebase.initializeApp(firebaseConfig);
 const db = firebase.firestore();

 let venCarrinho = JSON.parse(localStorage.getItem('ven_carrinho')) || [];
 let venDados = JSON.parse(localStorage.getItem('ven_dados')) || null;
 
 let fotosModalAtual = [];
 let fotoIndexAtual = 0;
 let mapaProdutosVen = {};
 let todosProdutosVen = [];

 window.addEventListener('DOMContentLoaded', () => {
   if (venDados) {
     mostrarPainelPrincipal();
   }
 });

 document.getElementById('formVendedora').addEventListener('submit', (e) => {
   e.preventDefault();
   venDados = {
     nome: document.getElementById('ven-nome').value,
     telefone: document.getElementById('ven-tel').value,
     email: document.getElementById('ven-email').value,
     endereco: document.getElementById('ven-endereco').value,
     numero: document.getElementById('ven-num').value,
     pix: document.getElementById('ven-pix').value,
     dataCadastro: new Date().toLocaleDateString('pt-BR')
   };

   localStorage.setItem('ven_dados', JSON.stringify(venDados));
   db.collection("vendedoras").add(venDados).catch(err => console.log(err));

   mostrarPainelPrincipal();
 });

 function mostrarPainelPrincipal() {
   document.getElementById('tela-cadastro-vendedora').style.display = 'none';
   document.getElementById('area-vendedora').style.display = 'block';
   document.getElementById('ven-nome-exibicao').innerText = venDados.nome.split(' ')[0];
   
   atualizarBadgeCarrinho();
   carregarMetricasVendedora();
   carregarCatalogoVendedora();
 }

 function logoutVendedora() {
   localStorage.removeItem('ven_dados');
   location.reload();
 }

 function alternarAba(nomeAba, btn) {
   document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
   document.querySelectorAll('#area-vendedora .app-section').forEach(s => s.classList.remove('active'));

   btn.classList.add('active');
   document.getElementById(`aba-${nomeAba}`).classList.add('active');

   if (nomeAba === 'produtos') carregarCatalogoVendedora();
   if (nomeAba === 'carrinho') carregarCarrinhoVendedora();
   if (nomeAba === 'vendas') carregarHistoricoVendedora();
   if (nomeAba === 'financeiro') carregarFinanceiroVendedora();
 }

 function atualizarBadgeCarrinho() {
   document.getElementById('qtd-carrinho-badge').innerText = venCarrinho.length;
 }

 function enviarCatalogoClienteWhatsapp() {
   const urlCatalogo = window.location.href.split('?')[0].replace('vendedora.html', 'catalogo.html');
   const msg = encodeURIComponent(`Olá! Confira as novidades do catálogo Toque Íntimo GS enviado pela consultora ${venDados.nome}: ${urlCatalogo}`);
   window.open(`https://wa.me/?text=${msg}`, '_blank');
 }

 function carregarCatalogoVendedora() {
   const container = document.getElementById('ven-grade-produtos');
   container.innerHTML = '<p style="grid-column: span 2; text-align: center; padding: 20px;">Carregando produtos...</p>';

   db.collection("produtos").get().then(snapshot => {
     todosProdutosVen = [];
     if (snapshot.empty) {
       container.innerHTML = '<p style="grid-column: span 2; text-align: center; padding: 20px;">Nenhum produto disponível.</p>';
       return;
     }

     snapshot.forEach(doc => {
       const p = doc.data();
       p.id = doc.id;
       todosProdutosVen.push(p);
     });

     renderizarCardsVendedora(todosProdutosVen);
   }).catch(err => {
     container.innerHTML = '<p style="grid-column: span 2; text-align: center; color: red; padding: 20px;">Erro ao carregar catálogo.</p>';
   });
 }

 function filtrarCategoriaVen(categoria, btn) {
   document.querySelectorAll('.btn-cat').forEach(b => b.classList.remove('active'));
   btn.classList.add('active');

   if (categoria === 'todas') {
     renderizarCardsVendedora(todosProdutosVen);
   } else {
     const filtrados = todosProdutosVen.filter(p => p.categoria && p.categoria.toLowerCase() === categoria.toLowerCase());
     renderizarCardsVendedora(filtrados);
   }
 }

 function renderizarCardsVendedora(lista) {
   const container = document.getElementById('ven-grade-produtos');
   container.innerHTML = '';
   mapaProdutosVen = {};

   if (!lista.length) {
     container.innerHTML = '<p style="grid-column: span 2; text-align: center; padding: 20px;">Nenhum produto nesta categoria.</p>';
     return;
   }

   lista.forEach(p => {
     if (!p.variacoes || !Array.isArray(p.variacoes)) return;

     const variacoesDisponiveis = p.variacoes.filter(v => (Number(v.quantidade) || 0) > 0);
     if (variacoesDisponiveis.length === 0) return;

     mapaProdutosVen[p.id] = { nome: p.nome, variacoes: variacoesDisponiveis, fotos: [] };

     let listaFotos = [];
     if (p.foto || p.imagem || p.fotoUrl) listaFotos.push(p.foto || p.imagem || p.fotoUrl);
     variacoesDisponiveis.forEach(v => {
       const f = v.foto || v.imagem || v.fotoUrl;
       if (f && !listaFotos.includes(f)) listaFotos.push(f);
     });
     if (listaFotos.length === 0) listaFotos.push('https://via.placeholder.com/150?text=Sem+Foto');

     mapaProdutosVen[p.id].fotos = listaFotos;
     const fotoCapa = listaFotos[0];

     let opcoesSelect = '';
     variacoesDisponiveis.forEach((v, idx) => {
       opcoesSelect += `<option value="${idx}">${v.cor || '-'} / ${v.tamanho || '-'} - R$ ${Number(v.preco || 0).toFixed(2)}</option>`;
     });

     container.innerHTML += `
       <div class="prod-card">
         <div style="height: 120px; border-radius: 8px; overflow: hidden; background: #f9f9f9; margin-bottom: 8px; cursor: pointer;" onclick="abrirGaleriaPorId('${p.id}')">
           <img src="${fotoCapa}" style="width: 100%; height: 100%; object-fit: cover;">
         </div>
         <b style="font-size: 13px; color: #333; margin-bottom: 4px;">${p.nome}</b>
         <select id="select-var-${p.id}" style="width: 100%; padding: 4px; font-size: 11px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 6px;">
           ${opcoesSelect}
         </select>
         <button class="btn-action" onclick="adicionarVariacaoPorId('${p.id}')">Adicionar</button>
       </div>
     `;
   });
 }

 function abrirGaleriaPorId(pId) {
   const prod = mapaProdutosVen[pId];
   if (prod && prod.fotos && prod.fotos.length > 0) {
     fotosModalAtual = prod.fotos;
     fotoIndexAtual = 0;
     atualizarFotoModal();
     document.getElementById('ven-modal-foto').style.display = 'flex';
   }
 }

 function mudarFotoModal(direcao) {
   fotoIndexAtual += direcao;
   if (fotoIndexAtual < 0) fotoIndexAtual = fotosModalAtual.length - 1;
   if (fotoIndexAtual >= fotosModalAtual.length) fotoIndexAtual = 0;
   atualizarFotoModal();
 }

 function atualizarFotoModal() {
   document.getElementById('ven-img-expandida').src = fotosModalAtual[fotoIndexAtual];
   document.getElementById('ven-foto-contador').innerText = `Foto ${fotoIndexAtual + 1} de ${fotosModalAtual.length}`;
 }

 function fecharFotoExpandidaVen() {
   document.getElementById('ven-modal-foto').style.display = 'none';
 }

 function adicionarVariacaoPorId(pId) {
   const prod = mapaProdutosVen[pId];
   const select = document.getElementById(`select-var-${pId}`);
   if (!prod || !select) return;

   const vEscolhida = prod.variacoes[select.value];
   if (vEscolhida) {
     venCarrinho.push({ idProd: pId, nome: prod.nome, cor: vEscolhida.cor, tamanho: vEscolhida.tamanho, preco: Number(vEscolhida.preco) || 0 });
     localStorage.setItem('ven_carrinho', JSON.stringify(venCarrinho));
     atualizarBadgeCarrinho();
     alert("Produto adicionado ao carrinho!");
   }
 }

 function carregarCarrinhoVendedora() {
   const container = document.getElementById('ven-itens-carrinho');
   if (!venCarrinho.length) {
     container.innerHTML = '<p style="text-align: center; color: #777;">Carrinho vazio.</p>';
     return;
   }
   container.innerHTML = '';
   venCarrinho.forEach((item, index) => {
     container.innerHTML += `
       <div style="background: #fff; padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
         <div>
           <b style="font-size: 13px;">${item.nome}</b><br>
           <small style="color: #666;">${item.cor} / ${item.tamanho} - R$ ${item.preco.toFixed(2)}</small>
         </div>
         <button onclick="removerCarrinhoVen(${index})" style="background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer;">X</button>
       </div>
     `;
   });
 }

 function removerCarrinhoVen(index) {
   venCarrinho.splice(index, 1);
   localStorage.setItem('ven_carrinho', JSON.stringify(venCarrinho));
   atualizarBadgeCarrinho();
   carregarCarrinhoVendedora();
 }

 function enviarPedidoParaLojaPrincipal() {
   if (!venCarrinho.length) return alert("Seu carrinho está vazio!");
   const totalPedido = venCarrinho.reduce((acc, i) => acc + (Number(i.preco) || 0), 0);
   const comissao = totalPedido * 0.15;

   db.collection("pedidos").add({
     vendedora: venDados.nome,
     telefone: venDados.telefone,
     pix: venDados.pix,
     itens: venCarrinho,
     total: totalPedido,
     comissao: comissao,
     data: new Date().toLocaleDateString('pt-BR'),
     dataCriacao: firebase.firestore.FieldValue.serverTimestamp(),
     status: 'Pendente'
   }).then(() => {
     alert("Pedido enviado com sucesso!");
     venCarrinho = [];
     localStorage.setItem('ven_carrinho', JSON.stringify(venCarrinho));
     atualizarBadgeCarrinho();
     alternarAba('vendas', document.querySelectorAll('.tab-btn')[2]);
   });
 }

 function carregarMetricasVendedora() {
   db.collection("pedidos").where("telefone", "==", venDados.telefone).get().then(snapshot => {
     let qtdVendas = 0;
     let valVendas = 0;
     let valComissao = 0;

     snapshot.forEach(doc => {
       const d = doc.data();
       valVendas += Number(d.total) || 0;
       valComissao += Number(d.comissao) || 0;
       if (d.itens && Array.isArray(d.itens)) qtdVendas += d.itens.length;
     });

     document.getElementById('ven-qtd-vendas').innerText = qtdVendas;
     document.getElementById('ven-val-vendas').innerText = `R$ ${valVendas.toFixed(2)}`;
     document.getElementById('ven-val-comissao').innerText = `R$ ${valComissao.toFixed(2)}`;
   });
 }

 function carregarHistoricoVendedora() {
   const container = document.getElementById('ven-historico-vendas');
   container.innerHTML = 'Carregando...';
   db.collection("pedidos").where("telefone", "==", venDados.telefone).get().then(snapshot => {
     container.innerHTML = '';
     if (snapshot.empty) {
       container.innerHTML = '<p style="text-align: center; color: #777;">Nenhuma venda registrada.</p>';
       return;
     }
     snapshot.forEach(doc => {
       const d = doc.data();
       container.innerHTML += `
         <div style="background: #fff; padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;">
           <b>Data: ${d.data || ''}</b><br>
           Total: R$ ${(Number(d.total)||0).toFixed(2)} | Comissão: R$ ${(Number(d.comissao)||0).toFixed(2)}<br>
           <small style="color: green;">Status: ${d.status || 'Processando'}</small>
         </div>
       `;
     });
   });
 }
