<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Produtos - Toque Íntimo GS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Cabeçalho -->
  <header class="bg-white p-4 text-center border-b sticky top-0 z-50 shadow-sm">
    <h1 class="text-xl font-bold text-[#501926]">Toque Íntimo GS</h1>
    <p class="text-xs text-gray-500 font-medium" id="info-atendimento">Carregando atendimento...</p>
  </header>

  <main class="max-w-4xl mx-auto p-4">
    <!-- Lista de Produtos -->
    <div id="grid-catalogo" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
  </main>

  <script>
    // 1. Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD6QAOn1t-W6E4465u3ACZ2bB25RIAkpbo",
      authDomain: "meucatalogoapp-c7e39.firebaseapp.com",
      projectId: "meucatalogoapp-c7e39",
      storageBucket: "meucatalogoapp-c7e39.appspot.com",
      messagingSenderId: "311764083576",
      appId: "1:311764083576:web:2630353079ec5294031e8d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let telefoneVendedora = "";
    let nomeVendedora = "";
    let codigoVendedora = "";

    // 2. Identificar Vendedora
    async function carregarDadosVendedora() {
      const urlParams = new URLSearchParams(window.location.search);
      codigoVendedora = urlParams.get('v');
      const telParam = urlParams.get('tel'); // Resgate direto via parâmetro opcional

      if (!codigoVendedora) {
        alert("Link do catálogo incompleto ou inválido. Por favor, solicite um novo link à sua vendedora.");
        return;
      }

      if (telParam) {
        telefoneVendedora = telParam.replace(/\D/g, '');
      }

      try {
        // Tenta buscar diretamente pelo ID do documento
        let doc = await db.collection("vendedoras").doc(codigoVendedora).get();
        
        if (doc.exists) {
          const dados = doc.data();
          nomeVendedora = dados.nome || "Vendedora";
          if (!telefoneVendedora && dados.telefone) {
            telefoneVendedora = dados.telefone.replace(/\D/g, '');
          }
        } else {
          // Busca por campo 'codigo' na coleção 'vendedoras'
          const query = await db.collection("vendedoras").where("codigo", "==", codigoVendedora).get();
          if (!query.empty) {
            const dados = query.docs[0].data();
            nomeVendedora = dados.nome || "Vendedora";
            if (!telefoneVendedora && dados.telefone) {
              telefoneVendedora = dados.telefone.replace(/\D/g, '');
            }
          } else {
            nomeVendedora = "Vendedora " + codigoVendedora;
          }
        }

        document.getElementById('info-atendimento').innerText = `Atendimento por: ${nomeVendedora}`;
      } catch (error) {
        console.error("Erro ao carregar vendedora:", error);
        document.getElementById('info-atendimento').innerText = `Atendimento Personalizado`;
      }
    }

    // 3. Enviar o Pedido do Cliente para o WhatsApp da Vendedora e Salvar no Firebase
    async function enviarPedidoWhatsApp(carrinhoCliente, clienteNome, clienteFone) {
      if (!telefoneVendedora) {
        alert("Não foi possível carregar o WhatsApp direto da vendedora. Verifique sua conexão e tente novamente.");
        return;
      }

      let total = 0;
      let resumoItens = [];

      carrinhoCliente.forEach(item => {
        const subtotal = item.preco * item.qtd;
        total += subtotal;
        resumoItens.push({
          id: item.id || "",
          nome: item.nome,
          quantidade: item.qtd,
          preco: item.preco
        });
      });

      // Registrar o pedido no banco de dados para a vendedora visualizar no painel dela
      try {
        await db.collection("pedidos").add({
          vendedoraNome: nomeVendedora,
          vendedoraCodigo: codigoVendedora,
          cliente: clienteNome || "Cliente do Catálogo",
          fone: clienteFone || "",
          data: new Date().toLocaleString('pt-BR'),
          total: total,
          pagamento: "Pendente",
          status: "Pendente",
          criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          itens: resumoItens
        });
      } catch (e) {
        console.error("Erro ao registrar pedido:", e);
      }

      // Montar mensagem formatada para o WhatsApp da vendedora
      let mensagem = `*NOVO PEDIDO DO CATÁLOGO*\n`;
      mensagem += `*Atendimento:* ${nomeVendedora}\n`;
      if (clienteNome) mensagem += `*Cliente:* ${clienteNome}\n`;
      mensagem += `------------------------------\n`;
      mensagem += `*ITENS ESCOLHIDOS:*\n`;

      carrinhoCliente.forEach(item => {
        const subtotal = item.preco * item.qtd;
        mensagem += `- ${item.qtd}x ${item.nome} (R$ ${subtotal.toFixed(2)})\n`;
      });

      mensagem += `------------------------------\n`;
      mensagem += `*TOTAL:* R$ ${total.toFixed(2)}\n\n`;
      mensagem += `Olá ${nomeVendedora}! Gostaria de finalizar o pedido desses itens.`;

      // Redireciona diretamente para o número individual da vendedora
      const linkWa = `https://api.whatsapp.com/send?phone=${telefoneVendedora}&text=${encodeURIComponent(mensagem)}`;
      window.open(linkWa, '_blank');
    }

    window.onload = () => {
      carregarDadosVendedora();
    };
  </script>
</body>
</html>
