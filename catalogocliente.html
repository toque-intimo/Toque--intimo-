<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Toque Íntimo GS</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #70293b;
      --bg: #f8f9fa;
      --success: #25D366;
    }
    body { background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .grid-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    @media (min-width: 640px) { .grid-catalogo { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    .card-prod { background: white; border-radius: 16px; border: 1px solid #eef0f2; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .img-container { width:100%; height:130px; background:#f5f5f5; border-radius:8px; display:flex; align-items:center; justify-content:center; overflow: hidden; }
    .img-container img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

  <!-- Header -->
  <header class="bg-white p-4 text-center border-b sticky top-0 z-40 shadow-sm">
    <h1 class="text-xl font-bold text-[#501926]">Toque Íntimo GS</h1>
    <p class="text-xs text-gray-500 font-medium" id="info-atendimento">Carregando atendimento...</p>
  </header>

  <!-- Conteúdo Principal -->
  <main class="max-w-4xl mx-auto p-4">
    <div id="grid-catalogo" class="grid-catalogo"></div>
  </main>

  <!-- Botão Flutuante do Carrinho -->
  <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto z-40">
    <button onclick="abrirCarrinho()" class="w-full bg-[#70293b] text-white py-3 px-6 rounded-full shadow-lg flex justify-between items-center font-bold text-sm">
      <span><i class="fa-solid fa-cart-shopping mr-2"></i> Ver Carrinho</span>
      <span id="floating-cart-count" class="bg-white text-[#70293b] px-2.5 py-0.5 rounded-full text-xs font-bold">0</span>
    </button>
  </div>

  <!-- Modal do Carrinho -->
  <div id="modal-carrinho" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-center items-end sm:items-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-3">
          <h2 class="text-lg font-bold text-[#70293b]">Seu Pedido</h2>
          <button onclick="fecharCarrinho()" class="text-gray-400 text-xl font-bold">&times;</button>
        </div>

        <div id="itens-carrinho-cliente" class="divide-y max-h-[40vh] overflow-y-auto mb-4"></div>

        <div class="border-t pt-3 space-y-3">
          <div class="flex justify-between font-bold text-base">
            <span>Total:</span>
            <span id="total-carrinho-cliente" class="text-[#70293b]">R$ 0,00</span>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1">Seu Nome</label>
            <input type="text" id="cliente-nome-input" placeholder="Digite seu nome completo" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-[#70293b]">
          </div>
        </div>
      </div>

      <button onclick="enviarPedidoVendedora()" class="w-full text-white font-bold py-3.5 rounded-xl shadow mt-4 flex justify-center items-center gap-2" style="background-color: var(--success);">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Enviar Pedido para Vendedora</span>
      </button>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6QAOn1t-W6E4465u3ACZ2bB25RIAkpbo",
      authDomain: "meucatalogoapp-c7e39.firebaseapp.com",
      projectId: "meucatalogoapp-c7e39",
      storageBucket: "meucatalogoapp-c7e39.appspot.com",
      messagingSenderId: "311764083576",
      appId: "1:311764083576:web:2630353079ec5294031e8d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let produtos = [];
    let carrinhoCliente = [];
    let telefoneVendedora = "";
    let nomeVendedora = "Vendedora";
    let codigoVendedora = "";

        async function inicializar() {
  const urlParams = new URLSearchParams(window.location.search);
  codigoVendedora = urlParams.get('v');
  const telParam = urlParams.get('tel');

  // Fallback caso venha o parâmetro ?tel= na URL
  if (telParam) {
    telefoneVendedora = formatarTelefone(telParam);
  }

  if (!codigoVendedora) {
    document.getElementById('info-atendimento').innerText = "Catálogo Geral";
    carregarProdutos();
    return;
  }

  try {
    // 1. Tenta buscar pelo ID do documento na coleção vendedoras
    let doc = await db.collection("vendedoras").doc(codigoVendedora).get();
    
    if (doc.exists) {
      const dados = doc.data();
      nomeVendedora = dados.nome || nomeVendedora;
      if (dados.telefone) {
        telefoneVendedora = formatarTelefone(dados.telefone);
      }
    } else {
      // 2. Se não achar pelo ID, busca pelo campo "codigo"
      const q = await db.collection("vendedoras").where("codigo", "==", codigoVendedora).get();
      if (!q.empty) {
        q.forEach(documento => {
          const dados = documento.data();
          if (dados.nome) nomeVendedora = dados.nome;
          if (dados.telefone && !telefoneVendedora) {
            telefoneVendedora = formatarTelefone(dados.telefone);
          }
        });
      }
    }
  } catch (e) {
    console.error("Erro ao buscar vendedora:", e);
  }

  document.getElementById('info-atendimento').innerText = `Atendimento por: ${nomeVendedora}`;
  carregarProdutos();
}

// Função para formatar o número do WhatsApp corretamente
function formatarTelefone(tel) {
  if (!tel) return "";
  
  // Remove tudo que não for número
  let num = String(tel).replace(/\D/g, '');
  
  // Se começou com 0 (ex: 011999999999), remove o 0 inicial
  if (num.startsWith('0')) {
    num = num.substring(1);
  }

  // Se tem 10 ou 11 dígitos (DDD + Número), adiciona o DDI do Brasil (55)
  if (num.length === 10 || num.length === 11) {
    num = "55" + num;
  }
  
  return num;
}

    function carregarProdutos() {
      db.collection("produtos").onSnapshot(snapshot => {
        produtos = [];
        snapshot.forEach(doc => produtos.push({ id: doc.id, ...doc.data() }));
        renderizarProdutos();
      });
    }

    function renderizarProdutos() {
      const grid = document.getElementById('grid-catalogo');
      grid.innerHTML = "";

      produtos.forEach(p => {
        const variacoesDisponiveis = (p.variacoes || []).filter(v => v.quantidade > 0);
        if (variacoesDisponiveis.length === 0) return;

        const menorPreco = Math.min(...variacoesDisponiveis.map(v => v.preco));
        const varComFoto = variacoesDisponiveis.find(v => v.foto) || {};

        let imgHtml = varComFoto.foto 
          ? `<img src="${varComFoto.foto}" alt="${p.nome}">` 
          : `<i class="fa-solid fa-image text-gray-300 text-3xl"></i>`;

        let opcoesSelect = "";
        variacoesDisponiveis.forEach((v, idx) => {
          opcoesSelect += `<option value="${idx}">${v.cor} (${v.tamanho}) - R$ ${v.preco.toFixed(2)}</option>`;
        });

        grid.innerHTML += `
          <div class="card-prod">
            <div>
              <div class="img-container mb-2">${imgHtml}</div>
              <h3 class="font-bold text-xs md:text-sm text-gray-800">${p.nome}</h3>
              <p class="text-xs font-bold text-[#70293b] my-1">A partir de R$ ${menorPreco.toFixed(2)}</p>
              <select id="select-var-${p.id}" class="w-full text-xs p-1.5 border rounded bg-white mb-2">
                ${opcoesSelect}
              </select>
            </div>
            <button onclick="adicionarAoCarrinho('${p.id}')" class="w-full bg-[#70293b] text-white text-xs font-bold py-2 rounded-lg">
              <i class="fa-solid fa-plus mr-1"></i> Adicionar
            </button>
          </div>`;
      });
    }

    function adicionarAoCarrinho(prodId) {
      const p = produtos.find(x => x.id === prodId);
      if (!p) return;

      const select = document.getElementById(`select-var-${prodId}`);
      const idxVar = select ? select.value : 0;
      const variacoesDisponiveis = (p.variacoes || []).filter(v => v.quantidade > 0);
      const variacao = variacoesDisponiveis[idxVar];

      if (!variacao) return;

      const key = `${p.id}_${variacao.cor}_${variacao.tamanho}`;
      const itemExistente = carrinhoCliente.find(c => c.key === key);

      if (itemExistente) {
        itemExistente.qtd += 1;
      } else {
        carrinhoCliente.push({
          key: key,
          id: p.id,
          nome: `${p.nome} (${variacao.cor} / Tam: ${variacao.tamanho})`,
          preco: variacao.preco,
          qtd: 1
        });
      }

      atualizarCarrinhoView();
    }

    function atualizarCarrinhoView() {
      const totalItens = carrinhoCliente.reduce((sum, i) => sum + i.qtd, 0);
      document.getElementById('floating-cart-count').innerText = totalItens;

      const container = document.getElementById('itens-carrinho-cliente');
      let total = 0;
      container.innerHTML = "";

      if (carrinhoCliente.length === 0) {
        container.innerHTML = `<p class="text-center text-sm text-gray-400 py-6">Seu carrinho está vazio.</p>`;
      } else {
        carrinhoCliente.forEach(item => {
          const subtotal = item.preco * item.qtd;
          total += subtotal;
          container.innerHTML += `
            <div class="py-2.5 flex justify-between items-center text-xs">
              <div class="flex-1 pr-2">
                <p class="font-bold text-gray-800">${item.nome}</p>
                <p class="text-gray-500">R$ ${item.preco.toFixed(2)} un.</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="font-bold">${item.qtd}x</span>
                <span class="font-bold text-sm w-16 text-right">R$ ${subtotal.toFixed(2)}</span>
              </div>
            </div>`;
        });
      }

      document.getElementById('total-carrinho-cliente').innerText = `R$ ${total.toFixed(2)}`;
    }

    function abrirCarrinho() {
      atualizarCarrinhoView();
      document.getElementById('modal-carrinho').classList.remove('hidden');
    }

    function fecharCarrinho() {
      document.getElementById('modal-carrinho').classList.add('hidden');
    }

    async function enviarPedidoVendedora() {
      if (carrinhoCliente.length === 0) {
        alert("Adicione pelo menos um produto ao carrinho antes de enviar.");
        return;
      }

      const clienteNome = document.getElementById('cliente-nome-input').value.trim();

      if (!telefoneVendedora) {
        alert("Erro: O WhatsApp direto da vendedora não foi localizado. Solicite o link atualizado diretamente à vendedora.");
        return;
      }

      let total = 0;
      let mensagem = `*NOVO PEDIDO DO CATÁLOGO*\n`;
      mensagem += `*Atendimento:* ${nomeVendedora}\n`;
      if (clienteNome) mensagem += `*Cliente:* ${clienteNome}\n`;
      mensagem += `------------------------------\n`;
      mensagem += `*ITENS ESCOLHIDOS:*\n`;

      carrinhoCliente.forEach(item => {
        const subtotal = item.preco * item.qtd;
        total += subtotal;
        mensagem += `- ${item.qtd}x ${item.nome} (R$ ${subtotal.toFixed(2)})\n`;
      });

      mensagem += `------------------------------\n`;
      mensagem += `*TOTAL:* R$ ${total.toFixed(2)}\n\n`;
      mensagem += `Olá ${nomeVendedora}! Gostaria de finalizar a compra desses itens.`;

      // Salvar pedido no Firebase para aparecer no painel da vendedora
      try {
        await db.collection("pedidos").add({
          vendedoraNome: nomeVendedora,
          vendedoraCodigo: codigoVendedora,
          cliente: clienteNome || "Cliente do Catálogo",
          data: new Date().toLocaleString('pt-BR'),
          total: total,
          status: "Pendente",
          pagamento: "Pendente",
          criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
          itens: carrinhoCliente.map(i => ({ nome: i.nome, quantidade: i.qtd, preco: i.preco }))
        });
      } catch (e) { console.error("Erro ao registrar pedido:", e); }

      // Abrir o WhatsApp da vendedora
      const linkWa = `https://api.whatsapp.com/send?phone=${telefoneVendedora}&text=${encodeURIComponent(mensagem)}`;
      window.open(linkWa, '_blank');
    }

    window.onload = inicializar;
  </script>
</body>
</html>
