<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Digital - Toque Íntimo GS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root { --primary: #70293b; --bg: #f8f9fa; }
    body { background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .grid-catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    @media (min-width: 640px) { .grid-catalogo { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
    .card-prod { background: white; border-radius: 16px; border: 1px solid #eef0f2; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .img-container-cat { width: 100%; height: 130px; background: #f5f5f5; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .img-container-cat img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto pb-24">

  <header class="text-center py-4 bg-white rounded-2xl shadow-sm border mb-6">
    <h1 class="text-2xl font-bold" style="color: #501926;">Toque Íntimo GS</h1>
    <p class="text-xs text-gray-500">Faça seu pedido diretamente pelo catálogo</p>
  </header>

  <div id="grid-produtos" class="grid-catalogo mb-8"></div>

  <!-- Barra Fixa Inferior / Carrinho do Cliente -->
  <div id="bar-carrinho" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-4xl mx-auto">
    <div>
      <span class="text-xs text-gray-500">Total do Pedido:</span>
      <p id="total-carrinho" class="font-bold text-lg" style="color: var(--primary);">R$ 0,00</p>
    </div>
    <button onclick="abrirModalFinalizar()" class="text-white px-6 py-2.5 rounded-lg font-bold" style="background-color: var(--primary);">
      Ver Pedido (<span id="qtd-carrinho">0</span>)
    </button>
  </div>

  <!-- Modal Finalizar Pedido -->
  <div id="modal-finalizar" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 flex">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md space-y-4">
      <h2 class="text-lg font-bold" style="color: var(--primary);">Finalizar Seu Pedido</h2>
      
      <div id="itens-checkout" class="divide-y text-sm max-h-48 overflow-y-auto"></div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seu Nome *</label>
        <input type="text" id="cliente-nome" required placeholder="Digite seu nome completo" class="w-full p-2.5 border rounded-lg text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Seu WhatsApp *</label>
        <input type="tel" id="cliente-fone" required placeholder="Ex: 11999999999" class="w-full p-2.5 border rounded-lg text-sm">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="fecharModalFinalizar()" class="w-1/2 py-2.5 border rounded-lg text-sm font-bold text-gray-600">Voltar</button>
        <button onclick="enviarPedidoFirebase()" class="w-1/2 py-2.5 text-white font-bold rounded-lg text-sm" style="background-color: var(--primary);">Enviar Pedido</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD6QAOn1t-W6E4465u3ACZ2bB25RIAkpbo",
      authDomain: "meucatalogoapp-c7e39.firebaseapp.com",
      projectId: "meucatalogoapp-c7e39",
      storageBucket: "meucatalogoapp-c7e39.appspot.com",
      messagingSenderId: "311764083576",
      appId: "1:311764083576:web:2630353079ec5294031e8d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const codigoVendedora = urlParams.get('v');

    let produtos = [];
    let carrinho = [];

    // Carregar Produtos
    db.collection("produtos").onSnapshot(snapshot => {
      produtos = [];
      snapshot.forEach(doc => produtos.push({ id: doc.id, ...doc.data() }));
      renderizar();
    });

    function renderizar() {
      const grid = document.getElementById('grid-produtos');
      grid.innerHTML = '';

      produtos.forEach(p => {
        const variacoes = (p.variacoes || []).filter(v => v.quantidade > 0);
        if (!variacoes.length) return;

        const varFoto = variacoes.find(v => v.foto) || {};
        let opcoesSelect = variacoes.map((v, i) => `<option value="${i}">${v.cor} (${v.tamanho}) - R$ ${v.preco.toFixed(2)}</option>`).join('');

        grid.innerHTML += `
          <div class="card-prod">
            <div class="img-container-cat">
              ${varFoto.foto ? `<img src="${varFoto.foto}">` : `<i class="fa-solid fa-image text-3xl text-gray-300"></i>`}
            </div>
            <span class="font-bold text-sm mt-2 block">${p.nome}</span>
            <span class="text-sm font-bold my-1 block" style="color: var(--primary);">A partir de R$ ${Math.min(...variacoes.map(v=>v.preco)).toFixed(2)}</span>
            <select id="var-${p.id}" class="w-full text-xs p-1 border rounded mb-2 bg-white">${opcoesSelect}</select>
            <button onclick="adicionar('${p.id}')" class="w-full py-2 text-white font-bold text-xs rounded" style="background-color: var(--primary);">Adicionar</button>
          </div>
        `;
      });
    }

    function adicionar(id) {
      const p = produtos.find(x => x.id === id);
      const variacoes = (p.variacoes || []).filter(v => v.quantidade > 0);
      const selIdx = document.getElementById(`var-${id}`).value;
      const v = variacoes[selIdx];

      const key = `${p.id}_${v.cor}_${v.tamanho}`;
      const item = carrinho.find(c => c.key === key);

      if (item) {
        if (item.qtd < v.quantidade) item.qtd++;
        else alert("Limite de estoque atingido!");
      } else {
        carrinho.push({ key, id: p.id, nome: `${p.nome} (${v.cor} / ${v.tamanho})`, preco: v.preco, qtd: 1 });
      }
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      const total = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
      const qtdTotal = carrinho.reduce((acc, i) => acc + i.qtd, 0);

      document.getElementById('total-carrinho').innerText = `R$ ${total.toFixed(2)}`;
      document.getElementById('qtd-carrinho').innerText = qtdTotal;
    }

    function abrirModalFinalizar() {
      if (!carrinho.length) return alert("Seu carrinho está vazio!");
      const div = document.getElementById('itens-checkout');
      div.innerHTML = carrinho.map(i => `<div class="py-2 flex justify-between"><span>${i.qtd}x ${i.nome}</span><span class="font-bold">R$ ${(i.preco * i.qtd).toFixed(2)}</span></div>`).join('');
      document.getElementById('modal-finalizar').classList.remove('hidden');
    }

    function fecharModalFinalizar() {
      document.getElementById('modal-finalizar').classList.add('hidden');
    }

    function enviarPedidoFirebase() {
      const nome = document.getElementById('cliente-nome').value.trim();
      const fone = document.getElementById('cliente-fone').value.trim();

      if (!nome || !fone) return alert("Por favor, informe seu nome e WhatsApp.");
      if (!codigoVendedora) return alert("Código de vendedora ausente no link!");

      const total = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);

      db.collection("pedidos").add({
        vendedoraCodigo: codigoVendedora,
        cliente: nome,
        fone: fone,
        data: new Date().toLocaleString('pt-BR'),
        total: total,
        status: "Pendente",
        pagamento: "Pendente",
        criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
        itens: carrinho.map(i => ({ nome: i.nome, quantidade: i.qtd, preco: i.preco }))
      }).then(() => {
        alert("Pedido enviado com sucesso! A vendedora entrará em contato.");
        carrinho = [];
        atualizarCarrinho();
        fecharModalFinalizar();
      }).catch(err => {
        console.error("Erro ao enviar pedido:", err);
        alert("Ocorreu um erro ao enviar o pedido. Tente novamente.");
      });
    }
  </script>
</body>
</html>
